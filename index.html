<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saleha Anwar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 22px;
    color: #0f172a;
    margin-bottom: 4px;
  }
  .tagline {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 24px;
    line-height: 1.4;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 16px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.15s ease;
  }
  .link-btn:hover { transform: translateY(-2px); }
  .linkedin { background: #0a66c2; color: #fff; }
  .github { background: #24292e; color: #fff; }
  .cv { background: #6366f1; color: #fff; }
  .email { background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; }
  .phone { background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; }
  .footer-note {
    margin-top: 24px;
    font-size: 12px;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">SA</div>
    <h1>Saleha Anwar</h1>
    <p class="tagline">Computer Science Student — AI, Data & Software Development</p>
    <div class="links">
      <a class="link-btn linkedin" href="https://linkedin.com/in/saleha-a-bb362a299" target="_blank">LinkedIn Profile</a>
      <a class="link-btn github" href="https://github.com/salehacodes" target="_blank">GitHub Profile</a>
      <a class="link-btn cv" href="Saleha_Anwar_CV.pdf" target="_blank">Download CV</a>
      <a class="link-btn email" href="mailto:salehaanwer53@gmail.com">salehaanwer53@gmail.com</a>
      <a class="link-btn phone" href="tel:+971503250335">+971 50 325 0335</a>
    </div>
    <p class="footer-note">Dubai, UAE</p>
  </div>
</body>
</html>
